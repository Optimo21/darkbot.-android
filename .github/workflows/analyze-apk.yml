name: Analyze and Patch APK

on:
  push:
    paths:
      - '.github/workflows/analyze-apk.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/Optimo21/darkbot.-android/releases/download/01/darkorbit-v0.1.1-android.apk"
          curl -L --fail --retry 8 --retry-all-errors -o darkorbit.apk "$url"
          echo "size=$(stat -c%s darkorbit.apk)"
          echo "68b917db3c6fa2d21d21b801fdf32f64d03de81c9faa782512e0abf4641bde4c  darkorbit.apk" | sha256sum -c -

      - name: Install Android reverse-engineering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless unzip zip p7zip-full ripgrep python3 apksigner zipalign
          curl -L --fail --retry 5 --retry-all-errors             -o apktool.jar             https://github.com/iBotPeaches/Apktool/releases/latest/download/apktool.jar
          java -jar apktool.jar --version

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx6g -jar apktool.jar d -f darkorbit.apk -o decoded
          find decoded/smali* -type f -name '*.smali' | wc -l | tee smali-count.txt

      - name: Detect and patch access limits
        shell: bash
        run: |
          set -euo pipefail
          cat > patch_smali.py <<'PY'
          import pathlib, re, json

          POSITIVE = re.compile(
              r'(^|[^a-z0-9])('
              r'is[_$]?authorized|is[_$]?whitelisted|is[_$]?allowlisted|'
              r'is[_$]?allowed|has[_$]?access|can[_$]?access|can[_$]?use|'
              r'is[_$]?unlimited|is[_$]?premium|is[_$]?vip|'
              r'has[_$]?entitlement|is[_$]?licensed|is[_$]?eligible'
              r')([^a-z0-9]|$)', re.I)
          NEGATIVE = re.compile(
              r'(^|[^a-z0-9])('
              r'is[_$]?limit[_$]?reached|has[_$]?reached[_$]?limit|'
              r'is[_$]?quota[_$]?exceeded|is[_$]?trial[_$]?expired|'
              r'is[_$]?restricted|is[_$]?access[_$]?denied|'
              r'is[_$]?banned|is[_$]?blocked|over[_$]?limit|'
              r'quota[_$]?exceeded|limit[_$]?reached|trial[_$]?expired'
              r')([^a-z0-9]|$)', re.I)
          SIGNAL_POS = re.compile(
              r'whitelist|allowlist|authorized|authorization|premium|vip|'
              r'entitlement|unlimited|licensed|eligible|access', re.I)
          SIGNAL_NEG = re.compile(
              r'limit|quota|restricted|denied|banned|blocked|trial', re.I)

          patched, candidates = [], []
          ms = re.compile(r'^\.method\b')
          me = re.compile(r'^\.end method\s*$')

          for path in pathlib.Path('decoded').glob('smali*/**/*.smali'):
              lines = path.read_text('utf-8', errors='ignore').splitlines()
              out, i, changed = [], 0, False
              while i < len(lines):
                  if not ms.match(lines[i]):
                      out.append(lines[i]); i += 1; continue
                  j = i + 1
                  while j < len(lines) and not me.match(lines[j]):
                      j += 1
                  if j >= len(lines):
                      out.extend(lines[i:]); break
                  block = lines[i:j+1]
                  header = block[0]
                  if not re.search(r'\)Z(?:\s|$)', header) or re.search(r'\b(native|abstract)\b', header):
                      out.extend(block); i = j + 1; continue
                  nm = re.search(r'\s([^\s(]+)\([^)]*\)Z', header)
                  name = nm.group(1) if nm else header
                  body = '\n'.join(block)
                  score, desired = 0, None
                  if POSITIVE.search(name): score, desired = score + 8, True
                  if NEGATIVE.search(name): score, desired = score + 10, False
                  if SIGNAL_POS.search(body):
                      score += 3
                      if desired is None: desired = True
                  if SIGNAL_NEG.search(body):
                      score += 2
                      if desired is None and any(x in body.lower() for x in ('limit','quota','denied')):
                          desired = False
                  if score >= 8 and desired is not None:
                      candidates.append({"file":str(path),"method":name,"desired":desired,"score":score})
                      out += [header, '    .locals 1',
                              f'    const/4 v0, {"0x1" if desired else "0x0"}',
                              '    return v0', '.end method']
                      changed = True
                  else:
                      out.extend(block)
                  i = j + 1
              if changed:
                  path.write_text('\n'.join(out)+'\n', encoding='utf-8')
                  patched.append(str(path))

          report = {"patched_files":patched,"patched_methods":candidates,"patched_count":len(candidates)}
          pathlib.Path('patch-report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          if not candidates:
              raise SystemExit("No strong boolean access/limit gate found")
          PY
          python3 patch_smali.py

      - name: Rebuild patched APK
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx6g -jar apktool.jar b decoded -o patched-unsigned.apk
          zipalign -f 4 patched-unsigned.apk patched-aligned.apk

      - name: Generate signing key and sign APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v             -keystore patch-release.keystore             -storepass changeit -keypass changeit             -alias darkbot -keyalg RSA -keysize 2048             -validity 10000             -dname "CN=Optimo21 Darkbot Patch, O=Optimo21"
          apksigner sign             --ks patch-release.keystore             --ks-pass pass:changeit             --key-pass pass:changeit             --out darkorbit-v0.1.1-unlimited.apk             patched-aligned.apk
          apksigner verify --verbose darkorbit-v0.1.1-unlimited.apk
          sha256sum darkorbit-v0.1.1-unlimited.apk > patched-sha256.txt
          stat -c%s darkorbit-v0.1.1-unlimited.apk > patched-size.txt

      - name: Publish patched APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="01-unlimited"
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag"             --title "v0.1.1 — Unlimited access"             --notes "Best-effort owner-authorized patch of the provided APK. Access/limit boolean gates were patched based on the decompiled code. This build is newly signed; the original signing key is not available here."             darkorbit-v0.1.1-unlimited.apk             patched-sha256.txt             patch-report.json

      - name: Persist analysis report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# APK patch report"
            echo
            cat patch-report.json
            echo
            echo "SHA-256:"
            cat patched-sha256.txt
            echo
            echo "Size:"
            cat patched-size.txt
          } > analysis-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-report.md
          git commit -m "Add APK patch report" || true
          git push origin HEAD:main || true

      - name: Close trigger issue
        if: ${{ github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --reason completed || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darkorbit-unlimited-build
          path: |
            darkorbit-v0.1.1-unlimited.apk
            patched-sha256.txt
            patch-report.json
            analysis-report.md
          retention-days: 14
