name: Analyze APK

on:
  push:
    paths:
      - '.github/workflows/analyze-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release APK
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/Optimo21/darkbot.-android/releases/download/01/darkorbit-v0.1.1-android.apk"
          curl -L --fail --retry 5 --retry-all-errors -o darkorbit.apk "$url"
          echo "Downloaded $(stat -c%s darkorbit.apk) bytes"
          echo "68b917db3c6fa2d21d21b801fdf32f64d03de81c9faa782512e0abf4641bde4c  darkorbit.apk" | sha256sum -c -

      - name: Install Android reverse-engineering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool unzip zip p7zip-full ripgrep python3-pip
          python3 -m pip install --user androguard

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail
          apktool d --force --no-res darkorbit.apk -o decoded
          find decoded/smali* -type f -name '*.smali' | wc -l | tee smali-count.txt
          find decoded -maxdepth 2 -type f | sort > decoded-files.txt

      - name: Search access/limit checks
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== APK metadata ==="
            unzip -p darkorbit.apk AndroidManifest.xml 2>/dev/null | strings | head -n 200 || true
            echo
            echo "=== Keyword matches in decoded smali/resources ==="
            rg -n -i --hidden --glob '!*.png' --glob '!*.jpg' --glob '!*.webp'               'limit|capped|cap|premium|vip|whitelist|allowlist|authorized|authoriz|trial|license|subscription|entitlement|restricted|access|free|unlimited|max.?users|max.?time|quota|permission' decoded               > keyword-matches.txt || true
            echo "=== Candidate conditionals ==="
            rg -n -i 'if-(eq|ne|lt|le|gt|ge).*\b(vip|premium|license|authorized|whitelist|trial|limit|quota|entitlement)\b|return-boolean' decoded/smali*               > conditional-candidates.txt || true
            echo "=== String inventory (selected) ==="
            rg -n -i 'limit|premium|vip|whitelist|authorized|trial|license|subscription|restricted|unlimited|quota|entitlement' decoded/res decoded/smali*               > selected-strings.txt || true
          } | tee analysis-summary.txt

      - name: Package a compact analysis report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "APK size: $(stat -c%s darkorbit.apk)"
            echo "APK SHA-256: $(sha256sum darkorbit.apk | cut -d' ' -f1)"
            echo
            echo "Smali file count: $(cat smali-count.txt)"
            echo
            echo "Top keyword matches:"
            head -n 400 keyword-matches.txt || true
            echo
            echo "Conditional candidates:"
            head -n 400 conditional-candidates.txt || true
            echo
            echo "Selected strings:"
            head -n 400 selected-strings.txt || true
          } > analysis-report.txt
          tar -czf apk-analysis-report.tgz analysis-report.txt keyword-matches.txt conditional-candidates.txt selected-strings.txt smali-count.txt decoded-files.txt
      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: apk-analysis-report
          path: apk-analysis-report.tgz
          retention-days: 7
