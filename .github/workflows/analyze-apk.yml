name: Analyze APK

on:
  push:
    paths:
      - '.github/workflows/analyze-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/Optimo21/darkbot.-android/releases/download/01/darkorbit-v0.1.1-android.apk"
          curl -L --fail --retry 5 --retry-all-errors -o darkorbit.apk "$url"
          echo "Downloaded $(stat -c%s darkorbit.apk) bytes"
          echo "68b917db3c6fa2d21d21b801fdf32f64d03de81c9faa782512e0abf4641bde4c  darkorbit.apk" | sha256sum -c -

      - name: Install APK tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apktool ripgrep unzip zip p7zip-full

      - name: Inventory and decode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw-strings
          unzip -Z1 darkorbit.apk > apk-files.txt
          for dex in $(unzip -Z1 darkorbit.apk | grep -E '^classes([0-9]+)?\.dex$' || true); do
            unzip -p darkorbit.apk "$dex" | strings -n 4 > "raw-strings/$dex.txt" || true
          done
          apktool d --force --no-res darkorbit.apk -o decoded

      - name: Locate access and limit logic
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "APK size: $(stat -c%s darkorbit.apk)"
            echo "APK SHA-256: $(sha256sum darkorbit.apk | cut -d' ' -f1)"
            echo
            echo "DEX files:"
            cat apk-files.txt | grep -E '^classes([0-9]+)?\.dex$' || true
            echo
            echo "Likely access/limit strings:"
            rg -n -i 'whitelist|allowlist|authorized|authorization|premium|vip|license|entitlement|subscription|trial|quota|limit|unlimited|max.?users|max.?time|restricted|access denied|not authorized|permission' raw-strings decoded/smali* decoded/res 2>/dev/null | head -n 2500 || true
            echo
            echo "Likely boolean gate methods:"
            rg -n -i '^\.method.*\b(is|has|can|check|allow|authorize|verify|validate|access|premium|vip|limit|quota|entitlement|licensed|whitelist|trial)' decoded/smali* 2>/dev/null | head -n 2000 || true
            echo
            echo "Likely hard-coded limits:"
            rg -n -i 'const(-wide)?/.*[0-9]+|const/4.*0x[0-9a-f]+|const/16.*0x[0-9a-f]+' decoded/smali* 2>/dev/null | head -n 2000 || true
            echo
            echo "Native libraries:"
            find decoded/lib -type f -maxdepth 3 2>/dev/null | sort || true
          } > analysis-report.txt

      - name: Commit report back to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp analysis-report.txt "/tmp/analysis-report.txt"
          git add -f analysis-report.txt
          git commit -m "Add generated APK analysis report" || exit 0
          git push origin HEAD:main

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-analysis-report
          path: analysis-report.txt
          retention-days: 7
