name: Analyze and Patch APK

on:
  push:
    paths:
      - '.github/workflows/analyze-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/Optimo21/darkbot.-android/releases/download/01/darkorbit-v0.1.1-android.apk"
          curl -L --fail --retry 8 --retry-all-errors -o darkorbit.apk "$url"
          echo "size=$(stat -c%s darkorbit.apk)"
          echo "68b917db3c6fa2d21d21b801fdf32f64d03de81c9faa782512e0abf4641bde4c  darkorbit.apk" | sha256sum -c -

      - name: Install Android reverse-engineering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless unzip zip p7zip-full ripgrep python3 apksigner zipalign
          curl -L --fail --retry 5 --retry-all-errors             -o apktool.jar             https://github.com/iBotPeaches/Apktool/releases/latest/download/apktool.jar
          java -version
          java -jar apktool.jar --version

      - name: Decode APK
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx6g -jar apktool.jar d -f darkorbit.apk -o decoded
          find decoded/smali* -type f -name '*.smali' | wc -l | tee smali-count.txt

      - name: Detect and patch access limits
        shell: bash
        run: |
          set -euo pipefail
          cat > patch_smali.py <<'PY'
          import pathlib, re, json

          POSITIVE = re.compile(
              r'(^|[^a-z0-9])('
              r'is[_$]?authorized|is[_$]?whitelisted|is[_$]?allowlisted|'
              r'is[_$]?allowed|has[_$]?access|can[_$]?access|can[_$]?use|'
              r'is[_$]?unlimited|is[_$]?premium|is[_$]?vip|'
              r'has[_$]?entitlement|is[_$]?licensed|is[_$]?eligible'
              r')([^a-z0-9]|$)', re.I)
          NEGATIVE = re.compile(
              r'(^|[^a-z0-9])('
              r'is[_$]?limit[_$]?reached|has[_$]?reached[_$]?limit|'
              r'is[_$]?quota[_$]?exceeded|is[_$]?trial[_$]?expired|'
              r'is[_$]?restricted|is[_$]?access[_$]?denied|'
              r'is[_$]?banned|is[_$]?blocked|over[_$]?limit|'
              r'quota[_$]?exceeded|limit[_$]?reached|trial[_$]?expired'
              r')([^a-z0-9]|$)', re.I)

          SIGNAL_POS = re.compile(
              r'whitelist|allowlist|authorized|authorization|premium|vip|'
              r'entitlement|unlimited|licensed|trial|access', re.I)
          SIGNAL_NEG = re.compile(
              r'limit|quota|restricted|denied|banned|blocked|trial', re.I)

          method_start = re.compile(r'^\.method\b')
          method_end = re.compile(r'^\.end method\s*$')

          patched = []
          candidates = []

          for path in pathlib.Path('decoded').glob('smali*/**/*.smali'):
              text = path.read_text('utf-8', errors='ignore')
              lines = text.splitlines()
              out = []
              i = 0
              changed = False
              while i < len(lines):
                  if not method_start.match(lines[i]):
                      out.append(lines[i]); i += 1; continue

                  start = i
                  j = i + 1
                  while j < len(lines) and not method_end.match(lines[j]):
                      j += 1
                  if j >= len(lines):
                      out.extend(lines[start:]); break

                  block = lines[start:j+1]
                  header = block[0]
                  is_bool = bool(re.search(r'\)Z(?:\s|$)', header))
                  is_native_or_abstract = bool(re.search(r'\b(native|abstract)\b', header))
                  if not is_bool or is_native_or_abstract:
                      out.extend(block); i = j + 1; continue

                  sig = header
                  body = '\n'.join(block)
                  m = re.search(r'\s([^\s(]+)\([^)]*\)Z', header)
                  name = m.group(1) if m else header

                  score = 0
                  desired = None

                  if POSITIVE.search(name):
                      score += 8
                      desired = True
                  if NEGATIVE.search(name):
                      score += 10
                      desired = False

                  if SIGNAL_POS.search(body):
                      score += 3
                      if desired is None:
                          desired = True
                  if SIGNAL_NEG.search(body):
                      score += 2
                      if desired is None and ('limit' in body.lower() or 'quota' in body.lower() or 'denied' in body.lower()):
                          desired = False

                  # Avoid touching generic accessors unless there is strong lexical evidence.
                  if score >= 8 and desired is not None:
                      candidates.append({
                          "file": str(path),
                          "method": name,
                          "desired": desired,
                          "score": score,
                          "header": header
                      })
                      indent = '    '
                      const = '0x1' if desired else '0x0'
                      replacement = [
                          header,
                          f'{indent}.locals 1',
                          f'{indent}const/4 v0, {const}',
                          f'{indent}return v0',
                          '.end method'
                      ]
                      out.extend(replacement)
                      changed = True
                  else:
                      out.extend(block)
                  i = j + 1

              if changed:
                  path.write_text('\n'.join(out) + '\n', encoding='utf-8')
                  patched.append(str(path))

          report = {
              "patched_files": patched,
              "patched_methods": candidates,
              "patched_count": len(candidates),
          }
          pathlib.Path('patch-report.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))

          if not candidates:
              print("NO_STRONG_BOOLEAN_GATE_FOUND")
              raise SystemExit(42)
          PY
          python3 patch_smali.py

      - name: Rebuild patched APK
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx6g -jar apktool.jar b decoded -o patched-unsigned.apk
          zipalign -f 4 patched-unsigned.apk patched-aligned.apk

      - name: Generate signing key and sign APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v             -keystore patch-release.keystore             -storepass changeit             -keypass changeit             -alias darkbot             -keyalg RSA -keysize 2048             -validity 10000             -dname "CN=Optimo21 Darkbot Patch, O=Optimo21"
          apksigner sign             --ks patch-release.keystore             --ks-pass pass:changeit             --key-pass pass:changeit             --out darkorbit-v0.1.1-unlimited.apk             patched-aligned.apk
          apksigner verify --verbose darkorbit-v0.1.1-unlimited.apk
          sha256sum darkorbit-v0.1.1-unlimited.apk | tee patched-sha256.txt
          stat -c%s darkorbit-v0.1.1-unlimited.apk | tee patched-size.txt

      - name: Publish patched APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="01-unlimited"
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag"             --title "v0.1.1 — Unlimited access"             --notes "Best-effort patch of the owner-provided APK. Access/limit boolean gates were patched to remove the identified restriction. Re-signed by this workflow; the original signing key is not available in this environment."             darkorbit-v0.1.1-unlimited.apk             patched-sha256.txt             patch-report.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darkorbit-unlimited-build
          path: |
            darkorbit-v0.1.1-unlimited.apk
            patched-sha256.txt
            patch-report.json
          retention-days: 14
